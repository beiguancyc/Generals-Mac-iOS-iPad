# GeneralsX macOS DXVK runtime configuration
#
# Keep sampler-type spec constants disabled by default.
# This setting is part of our macOS terrain shader stability baseline.
# DXVK source-of-truth is maintained in the fbraz3 fork branch.

d3d9.forceSamplerTypeSpecConstants = False

# macOS performance: compile D3D8/D3D9 pipelines on worker threads instead of
# stalling the render thread, and use Metal pipeline libraries to make first-use
# shader compilation (e.g. the selection box, new units/terrain) nearly instant.
dxvk.numCompilerThreads = 4
dxvk.enableGraphicsPipelineLibrary = True
